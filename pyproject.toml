[tool.black]
line-length = 120
skip-string-normalization = true
include = '\.pyi?$'
exclude = '''

(
  /(
      \.eggs         # exclude a few common directories in the
    | \.git          # root of the project
    | \.hg
    | \.venv
    | _build
    | buck-out
    | build
    | dist
    | scripts
    | stresstests
  )/
  | bootstrap.py           # also separately exclude a file named foo.py in
                     # the root of the project
)
'''

